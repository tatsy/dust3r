[project]
name = "dust3r"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "einops>=0.8.1",
  "gradio>=5.42.0",
  "huggingface-hub[torch]>0.22",
  "matplotlib>=3.10.5",
  "opencv-python>=4.12.0.88",
  "pyglet<2.0.0",
  "roma>=1.5.4",
  "scipy>=1.15.3",
  "tensorboard>=2.20.0",
  "tqdm>=4.67.1",
  "trimesh>=4.7.4",
  "torch>=2.6.0",
  "torchvision>=0.19.0",
  "ipywidgets>=8.1.7",
  "ipykernel>=6.30.1",
]

[project.optional-dependencies]
pillow-heif = [
  "kapture>=1.1.10",
  "kapture-localization>=1.1.10",
  "numpy-quaternion>=2024.0.10",
  "poselib>=2.0.4",
  "pycolmap>=3.12.4",
  "pyrender>=0.1.45",
]

[dependency-groups]
dev = ["ruff>=0.12.9"]

[tool.uv.sources]
torch = [
  { marker = "sys_platform == 'win32'", index = "pytorch-cu126" },
  { marker = "sys_platform == 'linux'", index = "pytorch-cu126" },
  { marker = "sys_platform == 'darwin'", index = "pytorch-cpu" },
]

torchvision = [
  { marker = "sys_platform == 'win32'", index = "pytorch-cu126" },
  { marker = "sys_platform == 'linux'", index = "pytorch-cu126" },
  { marker = "sys_platform == 'darwin'", index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true


[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
plugins = ["numpy.typing.mypy_plugin"]
disallow_any_generics = true
strict_optional = true
check_untyped_defs = true
allow_redefinition = true
